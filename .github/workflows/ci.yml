name: CI

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install "openpyxl>=3.1,<4" "paramiko>=3.0,<4"

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend build
        run: npm run build

      - name: Run Python tests
        run: |
          cd scripts
          python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare bundled runtime
        shell: pwsh
        run: .\tools\setup_runtime.ps1

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zbuild-windows
          path: |
            release/*.exe
            release/*.zip

  release:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare bundled runtime
        shell: pwsh
        run: .\tools\setup_runtime.ps1

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build and publish Electron app to GitHub Release
        id: publish
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release notes
        if: steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -z "$PREV" ]; then RANGE="HEAD"; else RANGE="$PREV..HEAD"; fi
          NOTES="## 变更内容"$'\n'"$(git log "$RANGE" --oneline --no-merges | sed 's/^/- /')"
          gh release edit "$GITHUB_REF_NAME" --title "v$VER" --notes "$NOTES"
