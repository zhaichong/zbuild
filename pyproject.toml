[project]
name = "zbuild"
version = "2.0.0"
description = "智慧病房系统构建与调试工具 — Python backend"
requires-python = ">=3.10"
dependencies = [
    "openpyxl==3.1.5",
    "paramiko==5.0.0",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
