[project]
name = "zbuild"
version = "2.0.0"
description = "特殊订单打包上传工具 — Python backend"
requires-python = ">=3.10"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
