name: CI

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install "openpyxl>=3.1,<4" "paramiko>=3.0,<4"

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run frontend build
        run: npm run build

      - name: Run Python tests
        run: |
          cd scripts
          python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Python runtime ZIP + fill manifest hash
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\tools\setup_runtime.ps1

      - name: Fill Python download URLs for artifact build
        shell: bash
        run: |
          set -euo pipefail
          # Artifact builds embed a non-empty HTTPS source. Real downloadability
          # is guaranteed only by the release job (tag push).
          PRIMARY="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/zbuild-python-3.11.9-win-x64.zip"
          node tools/fill-runtime-manifest.cjs --primary "$PRIMARY" --backup "$PRIMARY" --require-complete

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npm run dist -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zbuild-windows
          path: |
            release/*.exe
            release/*.zip
            release/zbuild-python-*.zip
            electron/runtime-manifest.json

  release:
    needs: test
    permissions:
      contents: write
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Python runtime ZIP + fill manifest hash
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\tools\setup_runtime.ps1

      - name: Fill Python download URLs from release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PRIMARY="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zbuild-python-3.11.9-win-x64.zip"
          node tools/fill-runtime-manifest.cjs --primary "$PRIMARY" --backup "$PRIMARY" --require-complete
          echo "Manifest after fill:"
          node -e "const m=require('./electron/runtime-manifest.json'); console.log(JSON.stringify(m.resources.python,null,2))"

      - name: Prepare Node 14 runtime
        shell: pwsh
        run: |
          $version = "14.21.3"
          $target = Join-Path $env:GITHUB_WORKSPACE "runtime\node"
          $zip = Join-Path $env:RUNNER_TEMP "node-$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "node-$version"
          if (-not (Test-Path (Join-Path $target "node.exe")) -or -not (Test-Path (Join-Path $target "node_modules\npm\bin\npm-cli.js"))) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip" -OutFile $zip -UseBasicParsing
            Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zip -DestinationPath $extract -Force
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item (Join-Path $extract "node-v$version-win-x64\*") $target -Recurse -Force
          }
          & (Join-Path $target "node.exe") --version
          & (Join-Path $target "node.exe") (Join-Path $target "node_modules\npm\bin\npm-cli.js") --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npm run dist -- --publish never

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VER" ]; then
            echo "版本不一致: tag=$VER package.json=$PACKAGE_VERSION"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -z "$PREV" ]; then RANGE="HEAD"; else RANGE="$PREV..HEAD"; fi
          NOTES="## 变更内容"$'\n'"$(git log "$RANGE" --oneline --no-merges -30 | sed 's/^/- /')"
          shopt -s nullglob
          EXE_FILES=(release/*.exe)
          BLOCKMAP_FILES=(release/*.blockmap)
          PY_ZIPS=(release/zbuild-python-*-win-x64.zip)
          if [ "${#EXE_FILES[@]}" -ne 1 ] || [ "${#BLOCKMAP_FILES[@]}" -ne 1 ] || [ ! -f release/latest.yml ]; then
            echo "发布资产不完整"
            printf 'exe: %s\n' "${EXE_FILES[*]:-none}"
            printf 'blockmap: %s\n' "${BLOCKMAP_FILES[*]:-none}"
            test -f release/latest.yml || echo 'latest.yml: missing'
            exit 1
          fi
          if [ "${#PY_ZIPS[@]}" -lt 1 ]; then
            echo "缺少 Python 运行时 ZIP (release/zbuild-python-*-win-x64.zip)"
            exit 1
          fi
          node tools/fill-runtime-manifest.cjs --require-complete
          if ! grep -q "^version: $VER$" release/latest.yml; then
            echo "latest.yml 版本与 tag 不一致"
            exit 1
          fi
          FILES=("${EXE_FILES[@]}" "${BLOCKMAP_FILES[@]}" release/latest.yml "${PY_ZIPS[@]}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "v$VER" --notes "$NOTES" --prerelease=false --latest
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --title "v$VER" --notes "$NOTES" --latest
          fi
