<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>执行进度</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .container {
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 90%;
      }
      .mascot {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        animation: bounce 2s infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .bubble {
        background: #f0f4ff;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        position: relative;
      }
      .bubble::after {
        content: '';
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-bottom-color: #f0f4ff;
        border-top: none;
      }
      .title {
        font-size: 18px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }
      .message {
        font-size: 14px;
        color: #666;
        line-height: 1.5;
      }
      .progress-bar {
        width: 100%;
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 12px;
        color: #999;
        text-align: center;
      }
      .result {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
      }
      .result.success {
        background: #d4edda;
        color: #155724;
      }
      .result.error {
        background: #f8d7da;
        color: #721c24;
      }
      .count {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }
      .dismiss-btn {
        margin-top: 16px;
        width: 100%;
        padding: 10px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .dismiss-btn:hover {
        background: #5568d3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="mascot">📦</div>
      <div class="bubble">
        <div class="title" id="title">准备执行...</div>
        <div class="message" id="message">正在等待任务开始</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 0</div>
      <div class="result" id="resultText" style="display: none;"></div>
      <div class="count" id="countText"></div>
      <button class="dismiss-btn" id="dismissBtn">关闭</button>
    </div>
    <script type="module" src="/src/mini.ts"></script>
  </body>
</html>
